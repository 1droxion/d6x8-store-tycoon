name: Android preview
on:
  workflow_dispatch:
  push:
    paths: ['mobile/**', 'public/game/**', '.github/workflows/android.yml']
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: mobile
      - run: npm run sync
        working-directory: mobile
      - run: chmod +x gradlew && ./gradlew assembleDebug bundleRelease lintDebug
        working-directory: mobile/android
      - uses: actions/upload-artifact@v4
        with:
          name: d6x8-android-preview
          path: |
            mobile/android/app/build/outputs/apk/debug/*.apk
            mobile/android/app/build/outputs/bundle/release/*.aab
            mobile/android/app/build/reports/lint-results-debug.html
