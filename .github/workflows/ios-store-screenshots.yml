name: iOS App Store screenshots
on:
  workflow_dispatch:
  push:
    paths: ['mobile/ios-store-capture/**', '.github/workflows/ios-store-screenshots.yml']
permissions:
  contents: read
jobs:
  capture:
    runs-on: macos-26
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        device: [iphone-medium, iphone-large, ipad-13]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --prefix mobile --ignore-scripts --no-audit --no-fund
      - run: npm run prepare:web --prefix mobile
      - run: node mobile/ios-store-capture/prepare.mjs
      - run: npx cap sync ios
        working-directory: mobile
      - run: |
          set -o pipefail
          xcodebuild -project mobile/ios/App/App.xcodeproj -scheme App -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath build/ios-store CODE_SIGNING_ALLOWED=NO build | tee ios-store-build.log
      - run: open -a Simulator
      - run: python3 -u mobile/ios-store-capture/capture.py
        timeout-minutes: 7
        env:
          CAPTURE_DEVICE: ${{ matrix.device }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-app-store-screenshots-${{ matrix.device }}
          path: |
            ios-store-screenshots/
            ios-store-build.log
